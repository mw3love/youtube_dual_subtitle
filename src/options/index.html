<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dual Subtitle for YouTube — Settings</title>
    <style>
      /* 옵션 디자인(A76) — 팝업(A75)과 같은 따뜻한 다크 + 앰버. 기본 글꼴(system-ui). */
      :root {
        color-scheme: dark;
        --bg: #181715;
        --card: #22201d;
        --line: #33302b;
        --field: #1c1a17;
        --field-line: #3a362f;
        --chip: #2d2a25;
        --text: #f1efe9;
        --muted: #a49d90;
        --cap: #cfc9bd;
        --accent: #ffb020;
        --accent-text: #ffd27a;
        --accent-bg: #2e2615;
        --ok: #8fd19e;
        --err: #ff8a80;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      a {
        color: var(--accent-text);
      }

      input[type='number'],
      input[type='text'],
      input[type='password'],
      select {
        height: 30px;
        box-sizing: border-box;
        background: var(--field);
        color: var(--text);
        border: 1px solid var(--field-line);
        border-radius: 8px;
        padding: 0 10px;
        font-family: inherit;
        font-size: 13px;
      }
      textarea {
        font-family: inherit;
        color: var(--text);
        background: var(--field);
        border: 1px solid var(--field-line);
        border-radius: 10px;
      }
      input[type='color'] {
        width: 36px;
        height: 30px;
        padding: 2px;
        background: var(--field);
        border: 1px solid var(--field-line);
        border-radius: 8px;
      }
      input[type='range'],
      input[type='radio'] {
        accent-color: var(--accent);
      }
      /* 체크박스 → 토글 스위치 모양(동작은 그대로 checkbox). */
      input[type='checkbox'] {
        appearance: none;
        position: relative;
        flex: none;
        width: 40px;
        height: 22px;
        margin: 0;
        border-radius: 11px;
        background: var(--field-line);
        cursor: pointer;
        transition: background 0.15s;
      }
      input[type='checkbox']::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #8a8376;
        transition: left 0.15s;
      }
      input[type='checkbox']:checked {
        background: var(--accent);
      }
      input[type='checkbox']:checked::after {
        left: 21px;
        background: var(--bg);
      }
      button {
        height: 30px;
        padding: 0 12px;
        background: var(--chip);
        color: var(--text);
        border: 1px solid var(--field-line);
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
      }
      button:hover:not(:disabled) {
        background: #3a362f;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      /* ── 배치: 왼쪽(목차 + 미리보기, 고정) · 오른쪽 본문 ── */
      .layout {
        display: flex;
        align-items: flex-start;
        gap: 40px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }
      .side {
        position: sticky;
        top: 24px;
        flex: none;
        width: 300px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .brand {
        padding: 0 12px;
        font-size: 15px;
        font-weight: 700;
      }
      .brand small {
        margin-left: 6px;
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
      }
      .toc {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .toc a {
        padding: 8px 12px;
        border-radius: 9px;
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
      }
      .toc a:hover {
        color: var(--text);
      }
      .toc a.on {
        background: var(--accent-bg);
        color: var(--accent-text);
        font-weight: 700;
      }
      .preview-label {
        margin: 0 0 6px 4px;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
      }
      .main {
        flex: 1;
        min-width: 0;
        max-width: 760px;
      }
      .main-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 4px 4px 22px;
      }
      .main-head h1 {
        margin: 0;
        font-size: 22px;
      }
      .save-state {
        font-size: 12px;
        color: var(--muted);
      }
      .save-state.saved {
        color: var(--ok);
      }

      /* ── 섹션 = 제목 + 카드 ── */
      .sec {
        margin-bottom: 28px;
        scroll-margin-top: 24px;
      }
      .sec-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 8px 4px;
        font-size: 14px;
        font-weight: 700;
        color: var(--cap);
      }
      .sec-head button {
        height: 24px;
        padding: 0 8px;
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
        background: transparent;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px 20px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 32px;
      }
      .row-label {
        flex: none;
        width: 160px;
        font-size: 13px;
      }
      .row-body {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .hint {
        font-size: 11.5px;
        color: var(--muted);
      }
      /* 행 아래 보충 설명 — 라벨 폭(160) + gap(12)만큼 들여 컨트롤 밑에 맞춘다. */
      .sub-hint {
        margin: -6px 0 0 172px;
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--muted);
      }
      .group-chip {
        align-self: flex-start;
        padding: 3px 10px;
        border-radius: 10px;
        background: var(--chip);
        font-size: 11px;
        font-weight: 700;
        color: var(--cap);
      }
      .group-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-left: 14px;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 4px 0;
      }

      /* 칩 — 몇 개 중 하나를 고르는 값(표시 모드·줄 수·쌓는 방식). */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        height: 30px;
        padding: 0 13px;
        border-radius: 999px;
        border-color: var(--field-line);
        background: var(--field);
        color: var(--cap);
        font-weight: 500;
      }
      .chip.on,
      .chip.on:hover {
        border-color: var(--accent);
        background: var(--accent-bg);
        color: var(--accent-text);
      }

      /* 번역 방식 라디오 — 선택지마다 카드 한 칸, 고른 칸은 앰버 테두리. */
      .choice {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 13px;
        cursor: pointer;
      }
      .choice:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-bg);
      }
      .choice input {
        margin-top: 2px;
      }

      .btn-test {
        border-color: #5a4416;
        color: var(--accent-text);
      }
      .btn-danger {
        border-color: #6b2a2a;
        color: #ffb3b3;
      }
      .ok {
        color: var(--ok);
      }
      .err {
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
